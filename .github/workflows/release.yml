name: Release

# Attaches the built app to a GitHub Release so players never install pnpm:
# tag `v<version from package.json>`, push it, and storyloom-dist.zip appears
# under Releases. Unzip it and serve it with `llama-server --path`.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cd dist && zip -qr ../storyloom-dist.zip .
      - run: gh release create "$TAG" storyloom-dist.zip --generate-notes --title "$TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
